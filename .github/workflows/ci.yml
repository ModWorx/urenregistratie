name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline script
        run: node -e "const fs=require('fs');const m=fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/);if(!m){console.error('geen <script> gevonden');process.exit(1)}fs.writeFileSync('/tmp/app.js',m[1]);"
      - name: Syntax check
        run: node --check /tmp/app.js
